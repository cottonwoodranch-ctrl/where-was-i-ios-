# Codemagic CI for "Where Was I?" iOS.
# Authenticates to App Store Connect via the account-level
# Developer Portal integration named "codemagic_api_key"
# (configured in the Codemagic UI). Do not commit real API keys or .p8 files.

workflows:
  ios-workflow:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.iqbal.wherewasi
      vars:
        BUNDLE_ID: "com.iqbal.wherewasi"
        XCODE_PROJECT: "WhereWasI.xcodeproj"
        XCODE_SCHEME: "WhereWasI"
        APP_STORE_APP_ID: "6839857964"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Set a unique build number
        script: |
          # App Store Connect rejects a second upload with the same build number.
          # Use max(latest TestFlight build + 1, Codemagic build number) so uploads made
          # outside Codemagic can never collide.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          NEXT=$((LATEST + 1))
          if [ "${BUILD_NUMBER:-0}" -gt "$NEXT" ]; then NEXT=$BUILD_NUMBER; fi
          sed -i "" "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$NEXT\"/" project.yml
          grep CURRENT_PROJECT_VERSION project.yml
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Set bundle identifier (if overridden in the UI)
        script: |
          /usr/libexec/PlistBuddy -c "Set :objects:PRODUCT_BUNDLE_IDENTIFIER $BUNDLE_ID" \
            WhereWasI.xcodeproj/project.pbxproj 2>/dev/null || true
          sed -i "" "s/com.iqbal.wherewasi/$BUNDLE_ID/g" project.yml
          xcodegen generate
      - name: Use code signing profiles from Codemagic
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        # Use the App Store Connect API key referenced in integrations
        # (codemagic_api_key) to authenticate the TestFlight upload.
        auth: integration
        # false: upload to TestFlight for internal testers (no Beta App Review needed).
        # true submits to external Beta App Review and fails the publish step unless
        # TestFlight "Test Information" (beta description, feedback email) is filled in.
        submit_to_testflight: false
        # expire_build_submitted_for_review: false
